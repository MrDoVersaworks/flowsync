name: FlowSync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit:
    name: Backend — migration, type check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - name: Database migration
        run: npm run migrate
        env:
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_32bytes
          AES_KEY: ci_aes_key_for_testing_purposes_only_32bytes
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db
      - name: Type Check
        run: npx tsc --noEmit
        env:
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_32bytes
          AES_KEY: ci_aes_key_for_testing_purposes_only_32bytes
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db
      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_32bytes
          AES_KEY: ci_aes_key_for_testing_purposes_only_32bytes
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db

  frontend-audit:
    name: Frontend — lint, type check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  
  e2e:
    name: End-to-end — Playwright
    runs-on: ubuntu-latest
    needs: [backend-audit, frontend-audit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2e_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_db
      JWT_SECRET: e2e_secret_key_for_testing_purposes_only_32bytes
      AES_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      ALLOWED_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
      BACKEND_URL: http://localhost:5000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Migrate E2E database
        working-directory: ./backend
        run: npm run migrate
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: ./frontend
        run: npx playwright test
